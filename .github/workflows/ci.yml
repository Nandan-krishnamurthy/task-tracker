# Automated verification: typecheck, then all three test tiers of ADR-0008.
#
# Deliberately separate from deploy.yml. That workflow publishes; this one
# verifies, and it also runs on pull requests, where nothing should deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same Node as deploy.yml; vitest 5 requires ^22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Tiers 1 and 2: unit (node) and DOM (jsdom).
      - name: Unit and DOM tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Tier 3. playwright.config.ts uses only the `list` reporter under CI, so
      # the HTML reporter is added here to produce a report worth uploading.
      # The config's webServer builds and previews the production bundle.
      - name: End-to-end tests
        run: npm run test:e2e -- --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
